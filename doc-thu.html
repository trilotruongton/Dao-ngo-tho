<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Đọc thử Ebook — Trí Lộ Trường Tồn</title>

    <style>
        /* CSS GỐC VÀ TỐI ƯU THÊM */
        body { margin: 0; font-family: 'Segoe UI', Roboto, Arial, sans-serif; background: #0b0f15; color: #eee; line-height: 1.6; }
        header { background: #000; color: #fff; padding: 15px 20px; border-bottom: 2px solid #ff3e3e; }
        header a { color: #fff; text-decoration: none; font-weight: 600; font-size: 14px; }
        
        main { max-width: 900px; margin: 20px auto; padding: 0 16px; }
        
        .book { background: #161c26; padding: 25px; border-radius: 12px; border: 1px solid #2a3341; box-shadow: 0 10px 30px rgba(0,0,0,0.5); }
        .book-info { display: flex; gap: 20px; margin-bottom: 20px; align-items: center; }
        .book img { width: 120px; border-radius: 8px; border: 1px solid #3d495d; object-fit: cover; }
        
        h1 { margin: 0; font-size: 24px; color: #fff; }
        .price { color: #00ff88; font-size: 18px; font-weight: bold; margin: 10px 0; }

        /* KHUNG HIỂN THỊ PDF */
        .pdf-wrapper {
            position: relative;
            background: #2a3341;
            border-radius: 8px;
            overflow: hidden;
            margin-top: 20px;
        }
        
        iframe {
            width: 100%;
            height: 700px; /* Tăng chiều cao để đọc sướng hơn */
            border: none;
            display: block;
        }

        /* NÚT HÀNH ĐỘNG */
        .actions { display: flex; gap: 10px; margin-top: 20px; flex-wrap: wrap; }
        .btn { 
            flex: 1; min-width: 200px; text-align: center; padding: 14px; 
            border-radius: 8px; font-weight: 700; text-decoration: none; 
            font-size: 15px; transition: 0.3s; border: none; cursor: pointer;
        }
        .btn.buy { background: #ff3e3e; color: #fff; }
        .btn.buy:hover { background: #cc0000; box-shadow: 0 5px 15px rgba(255, 62, 62, 0.4); }
        .btn.full-view { background: #2a3341; color: #fff; border: 1px solid #3d495d; }
        .btn.full-view:hover { background: #3d495d; }

        /* THÔNG BÁO DÀNH RIÊNG CHO MOBILE */
        .mobile-tip {
            background: rgba(255, 165, 0, 0.1);
            border-left: 4px solid #ffa500;
            padding: 12px;
            margin-bottom: 15px;
            font-size: 13px;
            display: none;
        }

        @media (max-width: 600px) {
            .mobile-tip { display: block; }
            iframe { height: 500px; }
            .book-info { flex-direction: column; text-align: center; }
            h1 { font-size: 20px; }
        }
    </style>
</head>

<body>

<header>
    <a href="index.html">← Quay lại cửa hàng</a>
</header>

<main>
    <div class="book">
        <div class="book-info">
            <img id="img" src="" alt="Bìa sách">
            <div>
                <h1 id="title">Đang tải...</h1>
                <div class="price" id="price"></div>
            </div>
        </div>

        <div class="mobile-tip">
            💡 <b>Mẹo:</b> Nếu không cuộn được nội dung bên dưới, hãy nhấn nút <b>"Xem toàn màn hình"</b> để đọc thoải mái hơn.
        </div>

        <div class="pdf-wrapper">
            <iframe id="pdf" title="Trình xem thử sách PDF"></iframe>
        </div>

        <div class="actions">
            <a class="btn full-view" id="full-view-btn" target="_blank" rel="noopener">🔍 Xem toàn màn hình</a>
            <a class="btn buy" id="buy-btn" target="_blank" rel="noopener">💬 Nhận bản đầy đủ</a>
        </div>
    </div>
</main>

<script>
    const books = {
        "kinh-thien": {
            title: "Kinh Thiên",
            price: "120.000đ", /* Bạn có thể tự sửa lại giá tiền hiển thị tại đây */
            img: "images/kinh-thien.jpg", /* Đảm bảo bạn đã lưu ảnh bìa tên là kinh-thien.jpg vào thư mục images */
            pdf: "previews/ban-doc-thu-kinh-thien.pdf" /* Đường dẫn tương đối đến tệp bạn vừa upload lên GitHub */
        },
        "tuyet-mat-nhan-tinh": {
            title: "Tuyệt Mật Nhân Tính",
            price: "0đ (Sách tặng)",
            img: "images/tuyet-mat-nhan-tinh.jpg",
            pdf: "previews/tuyet-mat-nhan-tinh-doc-thu.pdf"
        },
        "nhan-tinh-den-trang": {
            title: "Nhân Tính Đen Trắng",
            price: "90.000đ",
            img: "images/nhan-tinh-den-trang.jpg",
            pdf: "previews/nhan-tinh-den-trang-doc-thu.pdf"
        },
        "tu-duy-sau-sac": {
            title: "Tư Duy Sâu Sắc",
            price: "150.000đ",
            img: "images/tu-duy-sau-sac.jpg",
            pdf: "previews/tu-duy-sau-sac-doc-thu.pdf"
        },
        "thien-co-38-cuc": {
            title: "Thiên Cơ 38 Cục",
            price: "120.000đ",
            img: "images/thien-co-38-cuc.jpg",
            pdf: "previews/thien-co-38-cuc-doc-thu.pdf"
        },
        "logic-nguoi-ngheo": {
            title: "Logic Người Nghèo",
            price: "100.000đ",
            img: "images/logic-nguoi-ngheo.jpg",
            pdf: "previews/logic-nguoi-ngheo-doc-thu.pdf"
        },
        "kiem-dai": {
            title: "Kiếm Đại",
            price: "90.000đ",
            img: "images/kiem-dai.jpg",
            pdf: "previews/kiem-dai-doc-thu.pdf"
        }
    };

    // Lấy tham số 'sach' từ URL
    const params = new URLSearchParams(window.location.search);
    const bookID = params.get("sach");
    const book = books[bookID];

    if (book) {
        // Cập nhật thông tin giao diện
        document.getElementById("title").textContent = book.title;
        document.getElementById("price").textContent = "Giá: " + book.price;
        document.getElementById("img").src = book.img;
        document.getElementById("img").alt = "Bìa sách " + book.title;
        document.getElementById("full-view-btn").href = book.pdf;

        // Xử lý hiển thị PDF qua Google Viewer bằng đối tượng URL an toàn
        const absolutePdfUrl = new URL(book.pdf, window.location.href).href;
        document.getElementById("pdf").src = "https://docs.google.com/viewer?url=" + encodeURIComponent(absolutePdfUrl) + "&embedded=true";

        // Cập nhật link Messenger
        const fbID = "801523696387597";
        const message = `📘 Sách: ${book.title}\n💰 Giá: ${book.price}\n\nMình đã đọc thử và muốn sở hữu bản đầy đủ.`;
        document.getElementById("buy-btn").href = `https://m.me/${fbID}?text=${encodeURIComponent(message)}`;
        
    } else {
        document.querySelector(".book").innerHTML = "<h2>Không tìm thấy dữ liệu sách.</h2><a href='index.html' style='color:#fff'>Quay lại cửa hàng</a>";
    }
</script>

</body>
</html>
